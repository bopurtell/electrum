name: verification

on:
  pull_request:
  push:

jobs:
  required:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out electrum
        uses: actions/checkout@v4
        with:
          path: scaf

      - name: Read the normal ASIC source selection
        id: asic-source
        working-directory: scaf
        run: |
          jq -er '.asic.repository | capture("^https://github\\.com/(?<slug>[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)\\.git$").slug | "repository=\(.)"' tools-source.lock.json >> "$GITHUB_OUTPUT"
          revision=$(python3 -B scripts/install-tools.py --print-asic-revision)
          printf 'revision=%s\n' "$revision" >> "$GITHUB_OUTPUT"

      # Match the normal sibling checkout topology. Silver is a working-tree
      # capture locally; pin the clean input checkout for reproducibility in CI.
      - name: Check out the recorded ASIC library
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.asic-source.outputs.repository }}
          ref: ${{ steps.asic-source.outputs.revision }}
          path: hardcaml_asic

      - name: Check out Silver
        uses: actions/checkout@v4
        with:
          repository: bopurtell/silver
          ref: 43e5f8b4994683470c2a079e56acffe1f8daff8a
          path: silver

      - name: Install host verification tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes opam iverilog verilator yosys tcl
          opam init --bare --no-setup --yes

      - name: Install the OCaml prerequisites
        working-directory: scaf
        run: scripts/ocaml-deps.sh --install --tool-deps

      - name: Build and select project-local tools
        working-directory: scaf
        run: |
          # Some pinned upstream tests name this scratch directory explicitly.
          mkdir -p /tmp/opencode
          python3 -B scripts/install-tools.py

      - name: Check relocated flow entry points without provisioning or hardening
        working-directory: scaf
        run: |
          for script in scripts/*.sh asic_support/flow.sh asic_support/tinytapeout/scripts/*.sh; do
            bash -n "$script"
          done
          ./asic_support/tinytapeout/scripts/check-flow.sh

      - name: Run every required verification tier
        working-directory: scaf
        run: ./scripts/with-switch.sh dune build @verification -j5

      - name: Check Silver chip selection and authoring without EDA
        working-directory: scaf
        run: ./scripts/with-switch.sh python3 -B scripts/check-silver-chip-targets.py
