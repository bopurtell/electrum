project:
  title: "Hardcaml protocol emulator with independent hardware loader"
  author: "Bohdan Purtell"
  discord: ""
  description: "P3.5 fixed serial loader, integrated core, and registered program memory"
  language: "Verilog"
  clock_hz: 48000000
  tiles: "6x4"
  top_module: "tt_um_leemperor_hardcaml_protemu_loader"
  source_files:
    - "tt_um_leemperor_hardcaml_protemu_loader.v"

pinout:
  ui[0]: "Loader select, active low"
  ui[1]: "Loader host clock, idle low"
  ui[2]: "Loader host-to-device data"
  ui[3]: "Reserved"
  ui[4]: "Reserved"
  ui[5]: "Reserved"
  ui[6]: "Reserved"
  ui[7]: "Reserved"
  uo[0]: "Loader device-to-host data"
  uo[1]: "Loader response ready"
  uo[2]: "Reserved"
  uo[3]: "Reserved"
  uo[4]: "Reserved"
  uo[5]: "Reserved"
  uo[6]: "Reserved"
  uo[7]: "Reserved"
  uio[0]: "Protocol pin 0"
  uio[1]: "Protocol pin 1"
  uio[2]: "Protocol pin 2"
  uio[3]: "Protocol pin 3"
  uio[4]: "Protocol pin 4"
  uio[5]: "Protocol pin 5"
  uio[6]: "Protocol pin 6"
  uio[7]: "Protocol pin 7"

yaml_version: 6
